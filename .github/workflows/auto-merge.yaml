name: auto-merge

on:
  pull_request_target:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    env:
      AUTO_MERGE_TOKEN: ${{ secrets.GH_PAT_DEPENDABOT_AUTO_MERGE }}
    steps:
      - name: Explain unavailable auto-merge credentials
        if: env.AUTO_MERGE_TOKEN == ''
        run: echo "::notice::Automatic merging is unavailable without GH_PAT_DEPENDABOT_AUTO_MERGE; review and merge this PR manually after CI passes."
      - uses: actions/checkout@v4
        if: env.AUTO_MERGE_TOKEN != ''
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        if: env.AUTO_MERGE_TOKEN != ''
        with:
          github-token: ${{ secrets.GH_PAT_DEPENDABOT_AUTO_MERGE }}
          config: .github/depandabot-auto-merge.yml
